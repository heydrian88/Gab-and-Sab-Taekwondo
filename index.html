<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Empire | Gab & Sab Taekwondo Journey</title>
    <style>
        /* BASE THEME CONFIGURATIONS */
        * { box-sizing: border-box; margin: 0; padding: 0; margin-bottom: 0 !important; }
        html { scroll-behavior: smooth; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #121212; color: #ffffff; line-height: 1.6; }
        a { text-decoration: none; color: inherit; }
        
        /* LAYOUT & CONTAINERS */
        .max-width-container { max-w-7xl; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
        
        /* HEADER STYLING */
        header { position: sticky; top: 0; z-index: 50; background-color: rgba(18, 18, 18, 0.95); border-bottom: 1px solid #27272a; height: 80px; display: flex; align-items: center; }
        .header-wrap { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-box { width: 48px; height: 48px; background-color: #27272a; border-radius: 50%; border: 2px solid #dc2626; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; color: #a1a1aa; overflow: hidden; }
        .logo-box img { width: 100%; height: 100%; object-fit: cover; }
        .brand-text { font-size: 18px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
        .brand-text span { color: #dc2626; }
        .brand-sub { font-size: 11px; color: #a1a1aa; text-transform: uppercase; letter-spacing: 2px; display: block; margin-top: -2px; }
        nav { display: flex; align-items: center; gap: 32px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        nav a:hover { color: #dc2626; transition: color 0.2s; }
        .btn-sponsor-nav { background-color: #dc2626; padding: 8px 16px; border-radius: 4px; color: white !important; transition: background 0.2s; }
        .btn-sponsor-nav:hover { background-color: #b91c1c; }

        /* HERO SLIDESHOW CONTAINER */
        .hero-section { relative; height: 60vh; background-color: #09090b; overflow: hidden; position: relative; }
        .slide { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 0.8s ease-in-out; display: flex; align-items: flex-end; padding-bottom: 60px; z-index: 1; }
        .slide.active { opacity: 1; z-index: 5; }
        .slide-overlay { position: absolute; inset: 0; background: linear-gradient(to top, #121212 15%, rgba(18,18,18,0.4) 60%, rgba(0,0,0,0.6)); z-index: 2; }
        .slide-fallback-bg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 120px; color: #1f1f23; font-weight: 900; opacity: 0.3; z-index: 1; text-transform: uppercase; }
        .slide-text-box { position: relative; z-index: 10; max-width: 800px; padding: 0 20px; }
        .badge { display: inline-block; padding: 4px 10px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; border-radius: 3px; margin-bottom: 12px !important; color: white; }
        .badge.red { background-color: #dc2626; }
        .badge.blue { background-color: #1d4ed8; }
        .badge.gray { background-color: #4b5563; }
        .slide-title { font-size: 32px; font-weight: 900; text-transform: uppercase; tracking: -0.5px; line-height: 1.1; margin-bottom: 8px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .slide-desc { color: #d4d4d8; font-size: 15px; max-width: 650px; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        .slide-arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 20; background: rgba(39,39,42,0.6); color: white; border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .slide-arrow:hover { background: #dc2626; }
        .arrow-left { left: 20px; }
        .arrow-right { right: 20px; }

        /* BIOGRAPHY COMPONENT */
        .section-padding { padding: 80px 0; }
        .section-title-area { text-align: center; margin-bottom: 50px; }
        .section-title-area h2 { font-size: 32px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
        .title-divider { width: 60px; height: 4px; background-color: #dc2626; margin: 12px auto 0 auto; border-radius: 2px; }
        .title-divider.blue { background-color: #1d4ed8; }
        .bio-card { background-color: #1e1e1e; border: 1px solid #27272a; border-radius: 16px; padding: 30px; display: flex; flex-direction: column; justify-content: space-between; }
        .bio-card:hover { border-color: #3f3f46; }
        .profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; border-bottom: 1px solid #27272a; padding-bottom: 20px; }
        .profile-icon { width: 64px; height: 64px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; }
        .profile-icon.blue-bg { background-color: rgba(29, 78, 216, 0.15); color: #3b82f6; }
        .profile-icon.red-bg { background-color: rgba(220, 38, 38, 0.15); color: #ef4444; }
        .profile-name h3 { font-size: 22px; font-weight: 900; text-transform: uppercase; }
        .profile-meta { font-size: 13px; font-weight: 700; margin-top: 2px; }
        .meta-blue { color: #3b82f6; }
        .meta-red { color: #ef4444; }
        .info-stack { display: flex; flex-direction: column; gap: 14px; margin-bottom: 24px; }
        .info-item font-medium { font-size: 14px; color: #e4e4e7; }
        .info-label { color: #71717a; text-transform: uppercase; font-size: 11px; font-weight: 800; tracking: 0.5px; display: block; margin-bottom: 2px; }
        .rank-highlight { color: #ef4444; font-weight: bold; }
        .quote-block { color: #a1a1aa; font-style: italic; font-size: 13px; border-t: 1px solid #27272a; border-top: 1px solid #27272a; padding-top: 20px; line-height: 1.5; }

        /* DATA LOG TRACKER SECTIONS */
        .bg-muted { background-color: rgba(24, 24, 27, 0.4); border-top: 1px solid #27272a; border-bottom: 1px solid #27272a; }
        .tracker-header-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; flex-wrap: wrap; gap: 20px; }
        .tracker-title h2 { font-size: 24px; font-weight: 900; text-transform: uppercase; }
        .tracker-title p { color: #71717a; font-size: 12px; margin-top: 4px; font-weight: 500; }
        .btn-admin { background-color: #27272a; color: #e4e4e7; border: 1px solid #3f3f46; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 10px 16px; border-radius: 6px; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-admin:hover { background-color: #3f3f46; color: white; border-color: #52525b; }
        .filter-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; background-color: #1e1e1e; border: 1px solid #27272a; padding: 16px; rounded-xl: ; border-radius: 12px; margin-bottom: 24px; }
        .filter-group { display: flex; align-items: center; gap: 8px; }
        .filter-label { font-size: 11px; font-weight: 800; color: #71717a; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-filter-toggle { background-color: #27272a; color: #a1a1aa; border: none; font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .btn-filter-toggle.active-gab { background-color: #1d4ed8; color: white; }
        .btn-filter-toggle.active-sab { background-color: #dc2626; color: white; }
        .select-input { background-color: #121212; border: 1px solid #27272a; color: #d4d4d8; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: 600; outline: none; }
        .table-responsive { background-color: #1e1e1e; border: 1px solid #27272a; border-radius: 12px; overflow-x: auto; width: 100%; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 600px; font-size: 14px; }
        thead tr { background-color: #18181b; border-bottom: 1px solid #27272a; color: #71717a; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        th, td { padding: 14px 20px; }
        tbody tr { border-bottom: 1px solid rgba(39, 39, 42, 0.4); transition: background 0.15s; }
        tbody tr:hover { background-color: rgba(39, 39, 42, 0.2); }
        .badge-ath { font-size: 10px; font-weight: 900; padding: 2px 6px; border-radius: 4px; }
        .badge-ath.gab { background-color: rgba(29, 78, 216, 0.15); color: #3b82f6; }
        .badge-ath.sab { background-color: rgba(220, 38, 38, 0.15); color: #ef4444; }
        .td-title { font-weight: 700; color: white; }
        .td-meta { font-size: 12px; color: #71717a; }
        .badge-scale { font-size: 10px; font-weight: 700; text-transform: uppercase; background-color: #27272a; color: #d4d4d8; padding: 2px 8px; border-radius: 20px; }
        .badge-medal { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; display: inline-flex; align-items: center; gap: 4px; }
        .badge-medal.gold { background: rgba(245, 158, 11, 0.1); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.2); }
        .badge-medal.silver { background: rgba(212, 212, 216, 0.1); color: #e4e4e7; border: 1px solid rgba(212, 212, 216, 0.2); }
