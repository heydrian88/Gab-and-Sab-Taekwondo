<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gab & Sab Taekwondo Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCPkN1snF0SzDfP7yvVNGKpfklr68H5OZc",
            authDomain: "gab-and-sab-taekwondo.firebaseapp.com",
            projectId: "gab-and-sab-taekwondo",
            storageBucket: "gab-and-sab-taekwondo.firebasestorage.app",
            messagingSenderId: "137007670126",
            appId: "1:137007670126:web:bf2bd265e07b4c9534d77f",
            measurementId: "G-TMYZSP072L"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Default Data Fallback
        const defaultData = {
            headline: "Master Your Potential at Gab & Sab Taekwondo",
            subheadline: "Empowering discipline, strength, and character through professional martial arts training.",
            slideshow: [
                "https://images.unsplash.com/photo-1555597673-b21d5c935865?auto=format&fit=crop&w=1200&q=80",
                "https://images.unsplash.com/photo-1517649763962-0c623066013b?auto=format&fit=crop&w=1200&q=80",
                "https://images.unsplash.com/photo-1544717305-2782549b5136?auto=format&fit=crop&w=1200&q=80",
                "https://images.unsplash.com/photo-1517838277536-f5f99be501cd?auto=format&fit=crop&w=1200&q=80",
                "https://images.unsplash.com/photo-1563306406-e66174fa37bb?auto=format&fit=crop&w=1200&q=80"
            ]
        };

        let currentData = JSON.parse(JSON.stringify(defaultData));
        let currentSlide = 0;
        let slideInterval;

        async function loadPortalData() {
            try {
                const docRef = doc(db, "portal", "layout5");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    currentData = docSnap.data();
                } else {
                    await setDoc(docRef, defaultData);
                }
            } catch (e) {
                console.error("Error loading from Firebase, using defaults:", e);
            }
            renderPortal();
        }

        async function savePortalData() {
            try {
                const docRef = doc(db, "portal", "layout5");
                await setDoc(docRef, currentData);
                alert("Changes saved and synced globally to the cloud!");
            } catch (e) {
                console.error("Error saving to Firebase:", e);
                alert("Error saving changes. Check console.");
            }
            renderPortal();
        }

        function renderPortal() {
            // Render text
            document.getElementById('display-headline').innerText = currentData.headline;
            document.getElementById('display-subheadline').innerText = currentData.subheadline;

            // Populate admin inputs
            document.getElementById('admin-headline').value = currentData.headline;
            document.getElementById('admin-subheadline').value = currentData.subheadline;

            // Render slideshow container
            const container = document.getElementById('slideshow-container');
            container.innerHTML = '';
            currentData.slideshow.forEach((url, idx) => {
                const div = document.createElement('div');
                div.className = `absolute inset-0 transition-opacity duration-1000 ease-in-out ${idx === currentSlide ? 'opacity-100 z-10' : 'opacity-0 z-0'}`;
                div.innerHTML = `<img src="${url}" class="w-full h-full object-contain bg-black/90" alt="Slide ${idx + 1}">`;
                container.appendChild(div);
            });

            // Render admin photo inputs
            const photoSlotsContainer = document.getElementById('admin-photo-slots');
            photoSlotsContainer.innerHTML = '';
            currentData.slideshow.forEach((url, idx) => {
                photoSlotsContainer.innerHTML += `
                    <div class="flex flex-col space-y-2 p-3 bg-gray-800 rounded border border-gray-700">
                        <label class="text-xs text-gray-300 font-semibold">Photo ${idx + 1}</label>
                        <img src="${url}" class="w-full h-24 object-contain bg-black rounded" id="preview-${idx}">
                        <input type="file" accept="image/*" class="text-xs text-gray-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:bg-red-600 file:text-white hover:file:bg-red-700" onchange="handleImageUpload(event, ${idx})">
                    </div>
                `;
            });
        }

        function startSlideshow() {
            if (slideInterval) clearInterval(slideInterval);
            slideInterval = setInterval(() => {
                if (currentData.slideshow && currentData.slideshow.length > 0) {
                    currentSlide = (currentSlide + 1) % currentData.slideshow.length;
                    renderPortal();
                }
            }, 4000);
        }

        window.handleImageUpload = function(event, index) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentData.slideshow[index] = e.target.result;
                    document.getElementById(`preview-${index}`).src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        window.openAdminModal = function() {
            const pass = prompt("Enter Admin Password:");
            if (pass === "Beaisthebest88@") {
                document.getElementById('admin-modal').classList.remove('hidden');
            } else if (pass !== null) {
                alert("Incorrect password!");
            }
        }

        window.closeAdminModal = function() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        window.saveAdminChanges = function() {
            currentData.headline = document.getElementById('admin-headline').value;
            currentData.subheadline = document.getElementById('admin-subheadline').value;
            savePortalData();
            closeAdminModal();
        }

        window.onload = async function() {
            await loadPortalData();
            startSlideshow();
        }
    </script>
</head>
<body class="bg-gray-950 text-white font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Header Navigation -->
    <header class="bg-gray-900 border-b border-gray-800 p-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-fist-raised text-red-600 text-2xl"></i>
            <span class="font-bold text-lg tracking-wider">Gab & Sab Taekwondo</span>
        </div>
        <button onclick="openAdminModal()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded text-sm font-semibold transition flex items-center space-x-2">
            <i class="fa-solid fa-lock"></i>
            <span>Admin Login</span>
        </button>
    </header>

    <!-- Hero Section with Slideshow (Layout 5) -->
    <main class="flex-grow flex flex-col items-center justify-center p-4 relative overflow-hidden">
        <div class="absolute inset-0 z-0 overflow-hidden" id="slideshow-container">
            <!-- Dynamic Slides Render Here -->
        </div>

        <!-- Content Overlay -->
        <div class="relative z-20 text-center max-w-3xl mx-auto bg-black/60 p-8 rounded-xl backdrop-blur-sm border border-gray-800 shadow-2xl">
            <h1 id="display-headline" class="text-4xl md:text-5xl font-extrabold mb-4 tracking-tight text-white drop-shadow-md"></h1>
            <p id="display-subheadline" class="text-lg md:text-xl text-gray-300 mb-6 drop-shadow"></p>
            <a href="#contact" class="inline-block bg-red-600 hover:bg-red-700 text-white font-bold px-8 py-3 rounded-lg shadow-lg transition transform hover:scale-105">
                Join Our Classes
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 border-t border-gray-800 text-center py-4 text-xs text-gray-500">
        &copy; 2026 Gab & Sab Taekwondo Portal. All rights reserved. Globally Synced via Cloud.
    </footer>

    <!-- Admin Modal -->
    <div id="admin-modal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 w-full max-w-2xl rounded-xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b border-gray-800 pb-3">
                <h3 class="text-lg font-bold text-red-500 flex items-center space-x-2">
                    <i class="fa-solid fa-sliders"></i>
                    <span>Admin Control Panel</span>
                </h3>
                <button onclick="closeAdminModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1 text-gray-300">Headline</label>
                    <input type="text" id="admin-headline" class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-white focus:outline-none focus:border-red-600">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1 text-gray-300">Sub-headline</label>
                    <textarea id="admin-subheadline" rows="2" class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-white focus:outline-none focus:border-red-600"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2 text-gray-300">Hero Slideshow Photos (5 Photos - object-contain)</label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3" id="admin-photo-slots">
                        <!-- Dynamic Photo Slots Render Here -->
                    </div>
                </div>

                <div class="flex justify-end space-x-3 pt-4 border-t border-gray-800">
                    <button onclick="closeAdminModal()" class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded text-sm font-semibold transition">Cancel</button>
                    <button onclick="saveAdminChanges()" class="bg-red-600 hover:bg-red-700 px-5 py-2 rounded text-sm font-semibold transition shadow">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
