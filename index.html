<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiburcio Taekwondo Athletes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    .aspect-poster { aspect-ratio: 3 / 4; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col font-sans selection:bg-amber-500 selection:text-black">

  <!-- Navigation -->
  <nav class="border-b border-zinc-800 bg-zinc-900/50 backdrop-blur sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center font-black text-black text-sm">TT</div>
        <span class="font-bold tracking-wider uppercase text-sm text-zinc-200">Tiburcio Taekwondo</span>
      </div>
      <div class="flex items-center space-x-4">
        <button id="adminBtn" onclick="toggleAdminModal()" class="text-xs bg-zinc-800 hover:bg-zinc-700 px-3 py-1.5 rounded border border-zinc-700 transition">
          Admin Access
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Showcase Container -->
  <main class="max-w-4xl mx-auto w-full px-4 py-8 flex-1 flex flex-col items-center">
    
    <!-- Slideshow Poster Section -->
    <div class="w-full relative group rounded-2xl overflow-hidden border border-zinc-800 bg-zinc-900 shadow-2xl aspect-poster max-w-md mx-auto">
      
      <!-- Slide Image -->
      <img id="slideImg" src="" alt="Slide Image" class="w-full h-full object-cover transition-opacity duration-500 opacity-0">

      <!-- Gradient Overlay & Content -->
      <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent flex flex-col justify-end p-6 md:p-8">
        <div id="slideTag" class="text-xs font-bold tracking-widest text-amber-400 uppercase mb-1">...</div>
        <h2 id="slideTitle" class="text-2xl md:text-3xl font-black uppercase tracking-tight text-white mb-2 drop-shadow">...</h2>
        <p id="slideDesc" class="text-xs md:text-sm text-zinc-300 line-clamp-3">...</p>
        
        <!-- Navigation Controls -->
        <div class="flex items-center justify-between mt-6 pt-4 border-t border-zinc-800/80">
          <div class="flex space-x-1.5" id="slideDots"></div>
          <div class="flex space-x-2">
            <button onclick="prevSlide()" class="p-2 rounded-lg bg-zinc-800/80 hover:bg-amber-500 hover:text-black transition border border-zinc-700 text-xs">
              &larr; Prev
            </button>
            <button onclick="nextSlide()" class="p-2 rounded-lg bg-zinc-800/80 hover:bg-amber-500 hover:text-black transition border border-zinc-700 text-xs">
              Next &rarr;
            </button>
          </div>
        </div>
      </div>

    </div>

    <!-- Edit Button (Shown when logged in) -->
    <div id="adminControls" class="hidden mt-6 flex space-x-4">
      <button onclick="openSlideshowManager()" class="bg-amber-500 text-black font-semibold text-xs px-4 py-2 rounded shadow hover:bg-amber-400 transition">
        Manage Slideshow Photos
      </button>
    </div>

  </main>

  <!-- Admin Login Modal -->
  <div id="loginModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-zinc-900 border border-zinc-800 rounded-xl max-w-sm w-full p-6 relative">
      <h3 class="text-lg font-bold text-white mb-4">Admin Authentication</h3>
      <input type="password" id="passInput" placeholder="Enter password" class="w-full bg-zinc-950 border border-zinc-800 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500 mb-4">
      <div class="flex justify-end space-x-2">
        <button onclick="toggleAdminModal()" class="px-3 py-1.5 text-xs text-zinc-400 hover:text-white">Cancel</button>
        <button onclick="loginAdmin()" class="px-4 py-1.5 text-xs bg-amber-500 text-black font-bold rounded hover:bg-amber-400">Login</button>
      </div>
    </div>
  </div>

  <!-- Slideshow Manager Modal -->
  <div id="managerModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-zinc-900 border border-zinc-800 rounded-xl max-w-2xl w-full p-6 my-8">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-lg font-bold text-white">Manage Slideshow</h3>
        <button onclick="closeSlideshowManager()" class="text-zinc-400 hover:text-white text-xl">&times;</button>
      </div>
      
      <div id="slideFormsContainer" class="space-y-6 max-h-[60vh] overflow-y-auto pr-2">
        <!-- Forms dynamically generated here -->
      </div>

      <div class="mt-6 pt-4 border-t border-zinc-800 flex justify-end space-x-3">
        <button onclick="closeSlideshowManager()" class="px-4 py-2 text-xs text-zinc-400 hover:text-white">Close</button>
        <button onclick="saveAllSlides()" class="px-6 py-2 text-xs bg-amber-500 text-black font-bold rounded hover:bg-amber-400">Save All Changes</button>
      </div>
    </div>
  </div>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDhUc71NkqM3fj2RDK7V1HQ1IczIxZN5Ms",
      authDomain: "tiburcio-taekwondo.firebaseapp.com",
      projectId: "tiburcio-taekwondo",
      storageBucket: "tiburcio-taekwondo.firebasestorage.app",
      messagingSenderId: "29160052912",
      appId: "1:29160052912:web:6bc8bd2af067829901c376",
      measurementId: "G-CZ6Q7PCW3R"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Default Slides
    let slidesData = [
      { tag: "PRECISION & POWER", title: "FOCUS", desc: "Mastering form, speed, and continuous self-improvement in Taekwondo.", img: "https://images.unsplash.com/photo-1555597673-b21d5c935865?auto=format&fit=crop&w=800&q=80" },
      { tag: "NATIONAL CHAMPIONSHIPS", title: "GAB TO BACOLOD", desc: "Dominating local and national tournament brackets.", img: "https://images.unsplash.com/photo-1517838277536-f5f99be501cd?auto=format&fit=crop&w=800&q=80" }
    ];

    let currentSlide = 0;
    let isAdmin = false;

    // Load Slides from Firestore
    async function loadSlides() {
      try {
        const doc = await db.collection("website").doc("slideshow").get();
        if (doc.exists && doc.data().slides) {
          slidesData = doc.data().slides;
        }
      } catch (err) {
        console.warn("Using fallback slides data:", err);
      }
      renderSlide();
    }

    function renderSlide() {
      const slide = slidesData[currentSlide] || slidesData[0];
      const img = document.getElementById("slideImg");
      
      img.classList.add("opacity-0");
      setTimeout(() => {
        img.src = slide.img;
        document.getElementById("slideTag").innerText = slide.tag || "ATHLETE HIGHLIGHT";
        document.getElementById("slideTitle").innerText = slide.title || "";
        document.getElementById("slideDesc").innerText = slide.desc || "";
        img.classList.remove("opacity-0");
      }, 200);

      renderDots();
    }

    function renderDots() {
      const container = document.getElementById("slideDots");
      container.innerHTML = slidesData.map((_, i) => 
        `<div class="w-2 h-2 rounded-full transition-all ${i === currentSlide ? 'bg-amber-400 w-4' : 'bg-zinc-700'}"></div>`
      ).join('');
    }

    function nextSlide() {
      currentSlide = (currentSlide + 1) % slidesData.length;
      renderSlide();
    }

    function prevSlide() {
      currentSlide = (currentSlide - 1 + slidesData.length) % slidesData.length;
      renderSlide();
    }

    // Admin Access Controls
    function toggleAdminModal() {
      document.getElementById("loginModal").classList.toggle("hidden");
    }

    function loginAdmin() {
      const pass = document.getElementById("passInput").value;
      if (pass === "cuteako") {
        isAdmin = true;
        document.getElementById("adminControls").classList.remove("hidden");
        document.getElementById("adminBtn").innerText = "Admin Active";
        document.getElementById("adminBtn").classList.add("bg-amber-500", "text-black");
        toggleAdminModal();
      } else {
        alert("Incorrect Password!");
      }
    }

    function openSlideshowManager() {
      const container = document.getElementById("slideFormsContainer");
      container.innerHTML = slidesData.map((slide, i) => `
        <div class="p-4 bg-zinc-950 border border-zinc-800 rounded-lg space-y-3">
          <div class="font-bold text-amber-400 text-xs uppercase">Slide #${i + 1}</div>
          <input type="text" id="tag_${i}" value="${slide.tag || ''}" placeholder="Tag/Subtitle" class="w-full bg-zinc-900 border border-zinc-800 rounded px-3 py-1.5 text-xs text-white">
          <input type="text" id="title_${i}" value="${slide.title || ''}" placeholder="Headline Title" class="w-full bg-zinc-900 border border-zinc-800 rounded px-3 py-1.5 text-xs text-white">
          <textarea id="desc_${i}" placeholder="Description" class="w-full bg-zinc-900 border border-zinc-800 rounded px-3 py-1.5 text-xs text-white">${slide.desc || ''}</textarea>
          <div>
            <label class="block text-xs text-zinc-400 mb-1">Replace Image (Local File or URL):</label>
            <input type="file" accept="image/*" onchange="compressImage(event, ${i})" class="text-xs text-zinc-400 mb-2">
            <input type="text" id="img_${i}" value="${slide.img || ''}" placeholder="Image URL (auto-filled if file uploaded)" class="w-full bg-zinc-900 border border-zinc-800 rounded px-3 py-1.5 text-xs text-white">
          </div>
        </div>
      `).join('');

      document.getElementById("managerModal").classList.remove("hidden");
    }

    function closeSlideshowManager() {
      document.getElementById("managerModal").classList.add("hidden");
    }

    // Client-side Browser Canvas Image Compressor
    function compressImage(event, index) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (e) => {
        const img = new Image();
        img.src = e.target.result;
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const maxWidth = 800;
          const scaleSize = maxWidth / img.width;
          canvas.width = (img.width > maxWidth) ? maxWidth : img.width;
          canvas.height = (img.width > maxWidth) ? (img.height * scaleSize) : img.height;

          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          // Compress image to JPEG format at 70% quality (~100 KB)
          const compressedBase64 = canvas.toDataURL("image/jpeg", 0.7);
          document.getElementById(`img_${index}`).value = compressedBase64;
        };
      };
    }

    async function saveAllSlides() {
      const updatedSlides = slidesData.map((_, i) => ({
        tag: document.getElementById(`tag_${i}`).value,
        title: document.getElementById(`title_${i}`).value,
        desc: document.getElementById(`desc_${i}`).value,
        img: document.getElementById(`img_${i}`).value
      }));

      try {
        await db.collection("website").doc("slideshow").set({ slides: updatedSlides });
        slidesData = updatedSlides;
        renderSlide();
        closeSlideshowManager();
        alert("Slideshow updated successfully!");
      } catch (err) {
        alert("Error saving slides: " + err.message);
      }
    }

    // Init
    loadSlides();
  </script>
</body>
</html>
