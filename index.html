        .card-divider { width: 100%; height: 1px; background-color: #27272a; margin: 16px 0; }
        .perks-list { list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 12.5px; color: #a1a1aa; }
        .perks-list li { padding-left: 16px; position: relative; }
        .perks-list li::before { content: "✓"; position: absolute; left: 0; top: 0; color: #3b82f6; font-weight: 900; }
        .sponsor-card.featured .perks-list li::before { color: #dc2626; }
        .btn-tier-action { margin-top: 24px; width: 100%; border: none; font-size: 10px; font-weight: 800; text-transform: uppercase; padding: 10px; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .btn-tier-action.gray-btn { background-color: #27272a; color: white; }
        .btn-tier-action.gray-btn:hover { background-color: #3f3f46; }

        /* CONTROL FORM DIALOG INTERFACE MODAL */

        .btn-save { background-color: #dc2626; color: white; border: none; padding: 6px 16px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; cursor: pointer; }
// Hero Image Transitions Processing Logic
let slideIndex = 0;
const totalSlides = document.querySelectorAll('.slide');
function showSlides(index) {
if (index >= totalSlides.length) slideIndex = 0;
else if (index < 0) slideIndex = totalSlides.length - 1;
else slideIndex = index;
totalSlides.forEach((s, idx) => {
s.classList.toggle('active', idx === slideIndex);
});
}
function nextSlide() { showSlides(slideIndex + 1); }
function prevSlide() { showSlides(slideIndex - 1); }
// Automated image interval cycle tracking setup
setInterval(nextSlide, 5000);
// Core Local Storage Mockup Logs
const baselineData = [
{ id: 1, athlete: 'Gab', name: 'National Youth Sparring Cup Open', date: '2026-03-12', venue: 'Rizal Memorial Coliseum', scale: 'National', medal: 'Gold' },
{ id: 2, athlete: 'Sab', name: 'Luzon Regional Invitational Selection Tour', date: '2026-05-18', venue: 'Muntinlupa Sports Complex', scale: 'Local', medal: 'Gold' },
{ id: 3, athlete: 'Gab', name: 'All-School Sparring Invitationals', date: '2026-06-04', venue: 'Laguna Sports Gym', scale: 'Local', medal: 'Silver' },
{ id: 4, athlete: 'Sab', name: 'Philippine National Open Taekwondo Finals', date: '2026-08-21', venue: 'SM Mall of Asia Arena', scale: 'National', medal: 'Bronze' }
];
let database = [];
let filterAthVal = 'all';
let filterSclVal = 'all';
function initDatabase() {
const rawStored = localStorage.getItem('team_empire_tkd_logs');
database = rawStored ? JSON.parse(rawStored) : [...baselineData];
if(!rawStored) {
localStorage.setItem('team_empire_tkd_logs', JSON.stringify(database));
}
renderTable();
}
function renderTable() {
const tbody = document.getElementById('tableBody');
const noRec = document.getElementById('noRecords');
tbody.innerHTML = '';
const dataList = database.filter(item => {
const matchAthlete = (filterAthVal === 'all' || item.athlete === filterAthVal);
const matchScale = (filterSclVal === 'all' || item.scale === filterSclVal);
return matchAthlete && matchScale;
}).sort((a, b) => new Date(b.date) - new Date(a.date));
if(dataList.length === 0) {
noRec.classList.remove('hidden');
return;
}
noRec.classList.add('hidden');
dataList.forEach(item => {
const tr = document.createElement('tr');
const pathClass = item.athlete === 'Gab' ? 'gab' : 'sab';
let medalOutput = <span style="font-weight:700; color:#a1a1aa;">${item.medal}</span>;
if(item.medal === 'Gold') medalOutput = <span class="badge-medal gold">🥇 Gold</span>;
if(item.medal === 'Silver') medalOutput = <span class="badge-medal silver">🥈 Silver</span>;
if(item.medal === 'Bronze') medalOutput = <span class="badge-medal bronze">🥉 Bronze</span>;
tr.innerHTML = `
${item.athlete.toUpperCase()}
${item.name}
${item.date}
${item.venue}
${item.scale}
${medalOutput}
`;
tbody.appendChild(tr);
});
}
function filterAthlete(ath) {
filterAthVal = ath;
document.getElementById('btn-all').style = 'background-color:#27272a; color:#a1a1aa;';
document.getElementById('btn-gab').style = 'background-color:#27272a; color:#a1a1aa;';
document.getElementById('btn-sab').style = 'background-color:#27272a; color:#a1a1aa;';
const tgt = document.getElementById(btn-${ath.toLowerCase()});
if(ath === 'all') tgt.style = 'background-color:#dc2626; color:white;';
else if(ath === 'Gab') tgt.style = 'background-color:#1d4ed8; color:white;';
else tgt.style = 'background-color:#dc2626; color:white;';
renderTable();
}
function filterScale(scl) {
filterSclVal = scl;
renderTable();
}
function openModal() {
document.getElementById('adminModal').classList.remove('hidden');
}
function closeModal() {
document.getElementById('adminModal').classList.add('hidden');
document.getElementById('entryForm').reset();
}
function saveEntry(e) {
e.preventDefault();
const payload = {
id: Date.now(),
athlete: document.getElementById('athName').value,
name: document.getElementById('tourName').value,
date: document.getElementById('tourDate').value,
scale: document.getElementById('tourScale').value,
venue: document.getElementById('tourVenue').value,
medal: document.getElementById('tourMedal').value
};
database.push(payload);
localStorage.setItem('team_empire_tkd_logs', JSON.stringify(database));
renderTable();
closeModal();
}
function contactManager(package) {
window.location.href = mailto:your-email@://example.com{encodeURIComponent(package)};
}
window.addEventListener('DOMContentLoaded', initDatabase);
